[package]
name = "openstory-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck.workspace = true
openstory-core.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "metal", "dx12", "gles", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgl", "webgpu", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
